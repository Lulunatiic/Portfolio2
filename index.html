<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Lucie Guichard | Portfolio</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; color: #19232d; background: #f5f7f8; font: 16px/1.6 system-ui, sans-serif; }
		main { width: min(680px, calc(100% - 40px)); margin: 15vh auto; }
		.label { color: #477b68; font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
		h1 { margin: 12px 0; font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1.05; letter-spacing: -.05em; }
		p { color: #59656f; }
		.intro { max-width: 520px; font-size: 1.15rem; }
		nav { display: flex; gap: 20px; margin-top: 28px; }
		a { color: #28664f; font-weight: 650; text-underline-offset: 4px; }
		section { margin-top: 64px; padding-top: 20px; border-top: 1px solid #dce3df; }
		h2 { font-size: 1.1rem; }
	</style>
</head>
<body>
	<main>
		<div class="label">Designer · Developer</div>
		<h1>Hi, I’m Alex.</h1>
		<p class="intro">I build thoughtful, easy-to-use experiences for the web. Welcome to my little corner of the internet.</p>
		<nav aria-label="Contact and social links">
			<a href="mailto:hello@example.com">Say hello</a>
			<a href="https://github.com/">GitHub</a>
		</nav>
		<section aria-labelledby="work-title">
			<h2 id="work-title">A bit about my work</h2>
			<p>I enjoy turning ideas into simple, useful digital products. A few projects will be featured here soon.</p>
		</section>
	</main>
</body>
</html>
